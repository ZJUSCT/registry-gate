{{- if .Values.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "registry-gate.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "registry-gate.labels" . | nindent 4 }}
spec:
  parentRefs:
  {{- toYaml .Values.route.parentRefs | nindent 2 }}
  hostnames:
    - {{ .Values.hostname | quote }}
  rules:
    # The gate owns the auth surfaces. Exact matches win over the /v2
    # prefix rule below regardless of rule order, but keep them first
    # for readability.
    - matches:
        - path:
            type: Exact
            value: /service/token
        - path:
            type: Exact
            value: /v2
        - path:
            type: Exact
            value: /v2/
        - path:
            type: PathPrefix
            value: /token
        - path:
            type: PathPrefix
            value: /admin
      backendRefs:
        - name: {{ include "registry-gate.fullname" . }}
          namespace: {{ .Release.Namespace }}
          group: ""
          kind: Service
          weight: 1
          port: 8080
    # Everything under /v2/ (manifests, blobs) goes straight to Harbor.
    - matches:
        - path:
            type: PathPrefix
            value: /v2
      backendRefs:
        - name: {{ .Values.route.harborBackend.name }}
          namespace: {{ .Release.Namespace }}
          group: ""
          kind: Service
          weight: 1
          port: {{ .Values.route.harborBackend.port }}
{{- end }}
