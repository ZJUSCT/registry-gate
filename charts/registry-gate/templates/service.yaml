apiVersion: v1
kind: Service
metadata:
  name: {{ include "registry-gate.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "registry-gate.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "registry-gate.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: metrics
      port: 9090
      targetPort: metrics
